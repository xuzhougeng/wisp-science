name: Windows Build

# Manual diagnostic/packaging build (msi/nsis). Not tied to push — release
# packages only come from release-windows.yml on a version tag.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui -> target
          cache-on-failure: true

      # Prebuilt binaries. Compiling both from source took 16-22 minutes of
      # every Windows release, and the ~/.cargo/bin cache missed on tag runs.
      - name: Install Trunk and Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli@2

      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: src-tauri
          tauriScript: cargo tauri
          uploadWorkflowArtifacts: true
          args: --bundles msi,nsis
