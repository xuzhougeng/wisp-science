name: Windows Test Signing

# Manual Authenticode check. Uses the production eSigner credential (there is
# no separate test certificate) and does not publish a GitHub Release.
# Each .exe/.msi signature consumes an eSigner signing and waits for a fresh TOTP.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  test-signing:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
      ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
      ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
      ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
      ESIGNER_PIN: ${{ secrets.ESIGNER_PIN }}
      ESIGNER_PROGRAM_NAME: wisp-science
      ESIGNER_SIGN_LOG: ${{ runner.temp }}/esigner-signed.log
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui -> target
          cache-on-failure: true

      - name: Cache Trunk and Tauri CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: tauri-tools-${{ runner.os }}-v1

      - name: Install Trunk and Tauri CLI
        shell: pwsh
        run: |
          if (-not (Get-Command trunk -ErrorAction SilentlyContinue)) {
            cargo install trunk --locked
          }
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --version "^2" --locked
          }

      - name: Cache CodeSignTool
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/CodeSignTool
          key: codesigntool-1.3.2-windows

      - name: Install CodeSignTool
        shell: pwsh
        run: pwsh -NoProfile -File scripts/install_esigner_codesigntool.ps1

      - name: Build signed Windows installers
        shell: pwsh
        run: |
          $sign = (Resolve-Path 'scripts/esigner_sign.ps1').Path
          $config = Join-Path $env:RUNNER_TEMP 'esigner-tauri.json'
          & $sign -SignScript $sign -OutFile $config
          cargo tauri build --bundles msi,nsis --config $config
          if ($LASTEXITCODE -ne 0) { throw "cargo tauri build exited $LASTEXITCODE" }

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $files = @()
          $files += @(Get-ChildItem "target/release/bundle/msi/*.msi").FullName
          $files += @(Get-ChildItem "target/release/bundle/nsis/*.exe").FullName
          if ($files.Count -ne 2) { throw "Expected one MSI and one NSIS installer, found $($files.Count)" }
          & "scripts/assert_esigner_signatures.ps1" -Path $files -RequireSignedName wisp-science.exe

      - name: Upload signed installers
        uses: actions/upload-artifact@v4
        with:
          name: signed-installers-${{ github.sha }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
