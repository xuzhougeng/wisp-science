name: Native Apps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  shared-assets:
    needs: changes
    if: needs.changes.outputs.shared_assets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync_native_design.py --check
      - run: python3 scripts/sync_native_settings_contract.py --check
      - run: python3 scripts/test_sync_native_settings_contract.py

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test iOS remote protocol package
        run: swift test --package-path apps/ios --scratch-path target/ios-package
      - name: Select an installed iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/ios-simulators.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'ios-simulators.json').read_text())
          devices = [device for runtime, items in data['devices'].items()
                     if '.iOS-' in runtime for device in items
                     if device['name'].startswith('iPhone') and device['isAvailable']]
          if not devices:
              raise SystemExit('No available iPhone simulator in the runner Xcode installation')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('id=' + devices[0]['udid'] + '\n')
          PY
      - name: Compile iOS app, unit tests and UI tests without signing
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcodebuild -project apps/ios/WispScience.xcodeproj -scheme WispScience \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath target/ios-app CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Run iOS app unit tests
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcodebuild -project apps/ios/WispScience.xcodeproj -scheme WispScience \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath target/ios-app -resultBundlePath target/ios-unit-tests.xcresult \
            -only-testing:WispScienceTests CODE_SIGNING_ALLOWED=NO test-without-building
      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-unit-test-results
          path: target/ios-unit-tests.xcresult
          if-no-files-found: ignore

  swiftui:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: command -v trunk >/dev/null 2>&1 || cargo install trunk --locked
      - run: python3 -m unittest discover -s scripts -p 'test_*native_macos.py'
      - run: cargo test --locked -p wisp-app -p wisp-service -p wisp-dto
      - run: WISP_CATALOG_OFFLINE=1 cargo test --locked -p wisp-tauri --lib native_host
      - run: swift test --package-path apps/macos --scratch-path target/native-macos/swift
      - run: bash scripts/build_native_macos.sh
      - name: Archive unnotarized SwiftUI CI build
        run: ditto -c -k --keepParent 'target/native-macos/Wisp Science SwiftUI.app' target/Wisp-Science-SwiftUI-CI.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Wisp-Science-SwiftUI-CI-${{ runner.arch }}
          path: target/Wisp-Science-SwiftUI-CI.zip
          if-no-files-found: error

  winui:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: powershell -NoProfile -File scripts/test_build_native_windows.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_package_native_windows.py'
      - run: powershell -NoProfile -File scripts/test_ensure_native_windows_runtimes.ps1
      - run: cargo test --locked -p wisp-app -p wisp-service -p wisp-dto
      - run: dotnet run --project apps/windows/Wisp.ProjectBrowser.ContractTests -- contracts/project-browser/v1/projects.json
      - run: pwsh -File scripts/build_native_windows.ps1 -Configuration Release -RuntimeMode Both
      - name: Install NSIS and exercise preview packaging
        run: |
          choco install nsis --version=3.11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Version lookup failed.' }
          foreach ($variant in @('self-contained', 'framework-dependent')) {
            $app = if ($variant -eq 'self-contained') { 'target/native-windows-release' } else { 'target/native-windows-release-framework-dependent' }
            python scripts/package_native_windows.py $app --variant $variant --tag "v$version" --output "$env:RUNNER_TEMP/winui-release" --makensis "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
            if ($LASTEXITCODE -ne 0) { throw "Preview packaging failed: $variant" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Wisp-Science-WinUI-Preview-x64
          path: ${{ runner.temp }}/winui-release/*
          if-no-files-found: error
          compression-level: 0
