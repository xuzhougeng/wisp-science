name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  website-downloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix docs
      - run: npm test --prefix docs
      - run: npm run build --prefix docs
      - run: npm ci
        working-directory: ui-tests
      - run: npx playwright install --with-deps chromium
        working-directory: ui-tests
      - run: npx playwright test --config playwright.website.config.ts
        working-directory: ui-tests

  release-notes-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release-notes title helper
        run: bash scripts/github_release_notes.sh --self-test

  headless-agent-eval:
    name: Headless agent eval (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: headless-agent-${{ matrix.os }}

      # wisp-cli now links wisp-store, whose Linux keyring backend needs libdbus
      # at compile time even though debug builds persist secrets to a JSON file.
      # The rust job gets this transitively via webkit/gtk; this job does not.
      - name: Install Linux keyring build deps
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Run MCP process-tree shutdown regression
        run: cargo test -p wisp-mcp --test process_tree_shutdown

      # An ACP agent starts helpers of its own (Codex keeps a node_repl per
      # tool session). Stopping the agent must stop them on every OS (#1477).
      - name: Run ACP agent process-tree regression
        run: cargo test -p wisp-acp --test process

      - name: Test repository build launcher
        run: cargo test --locked -p wisp-dev

      - name: Test incremental frontend asset staging
        run: node --test ui/build-fast.test.mjs

      - name: Run project storage startup and migration regressions
        run: cargo test -p wisp-store -- project_storage::tests upgrade_backup::tests

      # Interpreters are often launchers: Windows Rscript.exe re-launches
      # bin\x64\Rscript.exe through cmd.exe. Stopping a runtime must reclaim
      # that whole tree, which only a real per-OS process tree can prove.
      - name: Run runtime worker process-tree regression
        run: cargo test -p wisp-runtime --test worker_process_tree

      # Exercise the Python worker and standalone skill helpers on all three
      # OSes, including process handling and project-relative planner paths.
      - name: Run Python worker and skill helper tests (Unix)
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s python -p "test_*.py" -v

      # python3 is not on PATH on windows-latest; the launcher is `python`.
      - name: Run Python worker and skill helper tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s python -p "test_*.py" -v

      - name: Run deterministic headless agent suite
        run: cargo run -p wisp-cli -- eval --artifacts target/headless-agent-eval --save target/headless-agent-eval/report.json

      - name: Upload headless eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-agent-eval-${{ matrix.os }}
          path: target/headless-agent-eval
          if-no-files-found: error

  windows-native-input:
    name: Windows native input reentrancy
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      WISP_CATALOG_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: windows-native-input
      # An explicit target keeps host build-dependency features from masking
      # missing Windows API features in the runtime (Tao uses windows 0.62).
      - name: Check desktop Windows target feature isolation
        run: cargo check --locked -p wisp-tauri --all-targets --target x86_64-pc-windows-msvc
      - name: Build desktop and native regression with the locked runtime
        run: cargo build --locked -p wisp-tauri --bin wisp-tauri --example windows_input_reentrancy_smoke
      # Each invocation owns a hidden native window and has a 45-second
      # watchdog. No WebView, real keyboard input, or user profile is involved.
      - name: Repeat sent-message reentry and serial controls
        shell: pwsh
        run: |
          for ($trial = 1; $trial -le 5; $trial++) {
            & .\target\debug\examples\windows_input_reentrancy_smoke.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\target\debug\examples\windows_input_reentrancy_smoke.exe --control
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  macos-native-redraw:
    name: macOS native redraw reentrancy
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      WISP_CATALOG_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: macos-native-redraw
      - name: Build desktop and native regression with the locked runtime
        run: cargo build --locked -p wisp-tauri --bin wisp-tauri --example macos_redraw_reentrancy_smoke
      # Each invocation owns a disposable native window and has a 45-second
      # watchdog. No WebView, user profile, or external service is involved.
      - name: Repeat redraw reentry, serial controls, and save-panel nested loops
        run: |
          set -euo pipefail
          for trial in 1 2 3 4 5; do
            ./target/debug/examples/macos_redraw_reentrancy_smoke
            ./target/debug/examples/macos_redraw_reentrancy_smoke --control
            ./target/debug/examples/macos_redraw_reentrancy_smoke --sheet
          done

  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, 1.90.0]
    steps:
      - uses: actions/checkout@v4

      # Keep the workspace MSRV explicit; floating stable alone does not catch
      # accidental dependency bumps past the version declared in Cargo.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui -> target
          cache-on-failure: true
          shared-key: rust-${{ matrix.toolchain }}

      # src-tauri (workspace member) pulls in webkit2gtk/gtk3 on Linux; these
      # aren't preinstalled on ubuntu-latest. See tauri.app/start/prerequisites.
      # Cache the .debs: azure.archive.ubuntu.com often crawls (~80 kB/s) or
      # hangs for hours on libwebkit2gtk-4.1-0 (~25 MB).
      - name: Cache Tauri apt packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-archives
          key: apt-tauri-${{ runner.os }}-${{ runner.arch }}-webkit4.1-v1

      - name: Install Tauri Linux dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          CACHE="${HOME}/.cache/apt-archives"
          mkdir -p "${CACHE}/partial"
          cleanup() {
            sudo chown -R "$(id -u):$(id -g)" "${CACHE}" 2>/dev/null || true
            rm -rf "${CACHE}/partial" "${CACHE}/lock"
          }
          trap cleanup EXIT
          APT_OPTS=(
            -o "Dir::Cache::archives=${CACHE}"
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          # azure.archive.ubuntu.com also hangs on the index fetch itself,
          # burning the whole `apt-get update` budget on Ign retries. Point
          # the runner's mirror list at the canonical archive and retry the
          # update, so one slow mirror cannot fail the job.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/apt-mirrors.txt
          fi
          for attempt in 1 2 3; do
            sudo timeout 4m apt-get "${APT_OPTS[@]}" update && break
            if [ "$attempt" = 3 ]; then
              echo "apt-get update failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep 10
          done
          sudo timeout 20m apt-get "${APT_OPTS[@]}" install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo check (wasm UI crate)
        run: cargo check --target wasm32-unknown-unknown
        working-directory: ui

  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ui -> target
          cache-on-failure: true

      - name: Cache Trunk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: trunk-${{ runner.os }}-v1

      - name: Install Trunk
        run: command -v trunk >/dev/null 2>&1 || cargo install trunk --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright deps
        working-directory: ui-tests
        run: npm ci

      - name: Install Chromium
        working-directory: ui-tests
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        working-directory: ui-tests
        run: npx playwright test
