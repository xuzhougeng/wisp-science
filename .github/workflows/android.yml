name: Android

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/ios/WispScience/DemoData/**'
      - 'apps/ios/WispScience/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
      - 'contracts/**'
      - 'ui/src/app_support/messages.rs'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/ios/WispScience/DemoData/**'
      - 'apps/ios/WispScience/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
      - 'contracts/**'
      - 'ui/src/app_support/messages.rs'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # v3 defaults to installing the removed `tools` package, which fails on current runners.
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - name: Check shared icon exports
        run: |
          python3 scripts/export_icons.py
          git diff --exit-code -- app/src/main/res/drawable app/src/main/res/drawable-nodpi
      - name: Test protocol and compile app and instrumentation
        run: ./gradlew :remote:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            apps/android/remote/build/reports/tests/
            apps/android/app/build/reports/tests/
            apps/android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
