name: Windows WinUI Preview Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (vX.Y.Z)
        required: true
      publish:
        description: Attach preview to the existing GitHub release (uncheck for a signing dry-run)
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: winui-preview-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      WISP_CATALOG_OFFLINE: '1'
      ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
      ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
      ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
      ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
      ESIGNER_PIN: ${{ secrets.ESIGNER_PIN }}
      ESIGNER_PROGRAM_NAME: Wisp Science WinUI Preview
      ESIGNER_SIGN_LOG: ${{ runner.temp }}/esigner-signed.log
      # One TOTP window behind Windows Release. Both jobs share one eSigner credential.
      WISP_SIGN_SLOT: winui
      # Match Cargo.toml explicitly: runner environment must not inflate helpers.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: s
      CARGO_PROFILE_RELEASE_LTO: 'true'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_INCREMENTAL: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Detect preview support in tagged source
        id: preview
        shell: pwsh
        run: |
          $enabled = Test-Path scripts/package_native_windows.py
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $enabled) { 'This tag predates WinUI preview packaging; skipping.' >> $env:GITHUB_STEP_SUMMARY }

      - uses: actions/checkout@v4
        if: steps.preview.outputs.enabled == 'true'
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/actions/wait-for-release
            scripts
          path: _release_ci

      - name: Wait for existing GitHub release
        if: steps.preview.outputs.enabled == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        uses: ./_release_ci/.github/actions/wait-for-release
        with:
          tag: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@v5
        if: steps.preview.outputs.enabled == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        if: steps.preview.outputs.enabled == 'true'
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.preview.outputs.enabled == 'true'
      - uses: swatinem/rust-cache@v2
        if: steps.preview.outputs.enabled == 'true'
        with:
          shared-key: winui-preview-release

      - name: Test build and installer routing
        if: steps.preview.outputs.enabled == 'true'
        run: |
          pwsh -File scripts/test_build_native_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Build routing tests failed.' }
          python -m unittest discover -s scripts -p 'test_package_native_windows.py'
          if ($LASTEXITCODE -ne 0) { throw 'Installer tests failed.' }
          powershell -NoProfile -File scripts/test_ensure_native_windows_runtimes.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Runtime bootstrap tests failed.' }

      - name: Cache CodeSignTool
        if: steps.preview.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/CodeSignTool
          key: codesigntool-1.3.2-windows

      - name: Install CodeSignTool
        if: steps.preview.outputs.enabled == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File _release_ci/scripts/install_esigner_codesigntool.ps1

      - name: Build both optimized x64 preview variants
        if: steps.preview.outputs.enabled == 'true'
        run: pwsh -File scripts/build_native_windows.ps1 -Configuration Release -RuntimeMode Both

      # Sign product executables before NSIS copies them into the installer.
      # Microsoft runtime DLLs stay as shipped; they are already signed.
      - name: Sign preview executables with eSigner
        if: steps.preview.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $sign = (Resolve-Path '_release_ci/scripts/esigner_sign.ps1').Path
          $names = @(
            'Wisp.Science.Preview.exe',
            'wisp-service.exe',
            (Join-Path 'settings-host' 'wisp-tauri.exe')
          )
          foreach ($app in @('target/native-windows-release', 'target/native-windows-release-framework-dependent')) {
            foreach ($name in $names) {
              & $sign (Join-Path $app $name)
              if ($LASTEXITCODE -ne 0) { throw "eSigner failed for $app $name" }
            }
          }

      - name: Install NSIS
        if: steps.preview.outputs.enabled == 'true'
        run: |
          choco install nsis --version=3.11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }

      - name: Package preview and enforce size budgets
        if: steps.preview.outputs.enabled == 'true'
        run: |
          foreach ($variant in @('self-contained', 'framework-dependent')) {
            $app = if ($variant -eq 'self-contained') { 'target/native-windows-release' } else { 'target/native-windows-release-framework-dependent' }
            python scripts/package_native_windows.py $app --variant $variant --tag $env:RELEASE_TAG --output "$env:RUNNER_TEMP/winui-release" --makensis "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
            if ($LASTEXITCODE -ne 0) { throw "Preview packaging failed: $variant" }
          }

      - name: Sign preview installers with eSigner
        if: steps.preview.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $sign = (Resolve-Path '_release_ci/scripts/esigner_sign.ps1').Path
          $installers = @(Get-ChildItem "$env:RUNNER_TEMP/winui-release/*_x64-*-setup.exe")
          if ($installers.Count -ne 2) { throw 'Expected both preview installers before signing.' }
          foreach ($installer in $installers) {
            & $sign $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "eSigner failed for $($installer.Name)" }
          }

      - name: Final checksum and size report after signing
        if: steps.preview.outputs.enabled == 'true'
        run: |
          $installers = @(Get-ChildItem "$env:RUNNER_TEMP/winui-release/*_x64-*-setup.exe")
          if ($installers.Count -ne 2) { throw 'Expected both preview variants.' }
          foreach ($installer in $installers) {
            python scripts/package_native_windows.py --finalize $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Final installer validation failed.' }
            $report = Get-Content ($installer.FullName -replace '\.exe$', '.size.json') -Raw | ConvertFrom-Json
            "$($report.variant): $([math]::Round($report.installer_bytes / 1MB, 1)) MiB installer / $($report.installer_limit_mib) MiB budget; $([math]::Round($report.payload_bytes / 1MB, 1)) MiB installed / $($report.payload_limit_mib) MiB budget." >> $env:GITHUB_STEP_SUMMARY
          }
          $files = @($installers.FullName)
          foreach ($app in @('target/native-windows-release', 'target/native-windows-release-framework-dependent')) {
            $files += Join-Path $app 'Wisp.Science.Preview.exe'
            $files += Join-Path $app 'wisp-service.exe'
            $files += (Join-Path (Join-Path $app 'settings-host') 'wisp-tauri.exe')
          }
          & "_release_ci/scripts/assert_esigner_signatures.ps1" -Path $files
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed.' }

      - uses: actions/upload-artifact@v4
        if: steps.preview.outputs.enabled == 'true'
        with:
          name: Wisp-Science-WinUI-Preview-${{ env.RELEASE_TAG }}-x64
          path: ${{ runner.temp }}/winui-release/*
          if-no-files-found: error
          compression-level: 0

      - name: Attach preview to existing release
        if: steps.preview.outputs.enabled == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem "$env:RUNNER_TEMP/winui-release" -File | Where-Object { $_.Name -match '\.(exe|sha256|json)$' })
          gh release upload $env:RELEASE_TAG --clobber @($files.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Preview upload failed.' }
          # Download the published bytes, rather than trusting asset names alone.
          $verify = Join-Path $env:RUNNER_TEMP 'winui-release-verify'
          New-Item -ItemType Directory -Force -Path $verify | Out-Null
          foreach ($variant in @('self-contained', 'framework-dependent')) {
            $installer = Get-Item "$env:RUNNER_TEMP/winui-release/*_x64-$variant-setup.exe"
            gh release download $env:RELEASE_TAG --pattern $installer.Name --pattern "$($installer.Name).sha256" --dir $verify --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Published preview download failed.' }
            $actual = (Get-FileHash (Join-Path $verify $installer.Name) -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = (Get-Content (Join-Path $verify "$($installer.Name).sha256")).Split(' ')[0]
            if ($actual -ne $expected) { throw 'Published preview checksum mismatch.' }
          }
