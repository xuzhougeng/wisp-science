[package]
name = "wisp-server"
description = "Headless Wisp host with built-in encrypted mobile web access."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
portable-pty = { workspace = true }
dunce = { workspace = true }
flate2 = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
qrcode = { version = "0.14.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
hex = { workspace = true }
ignore = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
walkdir = { workspace = true }
which = "7"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { workspace = true }
wisp-acp = { workspace = true }
wisp-app = { workspace = true }
wisp-bio = { workspace = true }
wisp-core = { workspace = true }
wisp-dto = { workspace = true }
wisp-llm = { workspace = true }
wisp-mcp = { workspace = true }
wisp-runs = { workspace = true }
wisp-runtime = { workspace = true }
wisp-paths = { workspace = true }
wisp-skills = { workspace = true }
wisp-store = { workspace = true }
wisp-sync = { workspace = true }
wisp-tools = { workspace = true }

[dev-dependencies]
tempfile = "3"
