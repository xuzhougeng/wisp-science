[package]
name = "wisp-tools"
description = "Built-in agent tools (read/write/edit/search/grep/shell/attempt_completion) with Windows-aware safety and path sandbox."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
regex = { workspace = true }
glob = { workspace = true }
walkdir = { workspace = true }
dunce = { workspace = true }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
anydoc = "0.1.6"
roxmltree = "0.21"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = { workspace = true }
chrono = { workspace = true }
wisp-llm = { workspace = true }
wisp-dto = { workspace = true }

# ProcessTree needs process groups on Unix and Job Objects on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
