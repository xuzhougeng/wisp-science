[package]
name = "wisp-gpui"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
description = "Wisp's cross-platform GPUI desktop migration"

# Like ui/, keep renderer dependencies out of headless builds and their MSRV.
[workspace]

[dependencies]
anyhow = "1"
# A terminal's output arrives base64-encoded, as the native clients read it.
base64 = "0.22"
# Local dates for the research history; already built for the host crates.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
# Compile Metal at launch in this preview, so building does not require the
# separately downloaded Xcode Metal Toolchain. Other backends are unaffected.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = { version = "=0.5.1", default-features = false }
# PDF pages drawn on the CPU in pure Rust, the same on macOS and Windows,
# with its fonts and CMaps built in for PDFs that do not embed theirs.
hayro = "0.9"
# A conversation's answers as HTML for a page to share; the Markdown reader
# the text views already use, without raw HTML or unsafe links.
markdown = "1"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
# The screen of a terminal drawn in the window: what a shell's output
# leaves on it, cell by cell, with colours and the cursor.
vt100 = "0.18"
wisp-dto = { path = "../../crates/wisp-dto" }
wisp-server = { path = "../../crates/wisp-server" }
wisp-sync = { path = "../../crates/wisp-sync" }

# Published gpui-component 0.5.1 gives no gap between a text view's
# paragraphs. Provenance and removal criteria:
# vendor/gpui-component/WISP-PATCH.md.
[patch.crates-io]
gpui-component = { path = "../../vendor/gpui-component" }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
