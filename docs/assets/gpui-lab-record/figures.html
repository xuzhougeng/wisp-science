body{background:var(--paper);color:var(--ink);font:14px/1.65 var(--sans);

/* stamp: the status mark */
.stamp{display:inline-block;font:400 11px/1.5 var(--mono);padding:0 6px;border:1px solid currentColor;border-radius:var(--r-stamp);white-space:nowrap}
.ok{color:var(--ok)} .wait{color:var(--wait)} .bad{color:var(--bad)} .run{color:var(--run)}

/* three root rules */
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-block:1px solid var(--line-strong)}
.rules>div{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rules>div+div{border-left:1px solid var(--line)}

@media(max-width:640px){.rules{grid-template-columns:1fr}.rules>div+div{border-left:0;border-top:1px solid var(--line)}}

/* findings list: a ledger */

.ledger>div>span:first-child{font:12px/1.9 var(--mono);color:var(--faded)}
.ledger b{font-weight:400}

/* tokens */
.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sw{border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;background:var(--paper)}

.scroll{overflow-x:auto}

.body{display:grid}

.entry>.c::before{content:"";position:absolute;left:-4px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--paper);border:1px solid var(--ink)}

.q{font:400 17px/1.45 var(--serif)}

:root[data-theme="dark"] .btn.pri{color:#0b1f1c}

.btn.txt{border-color:transparent;background:none;padding-inline:6px}
.side{background:var(--margin);border-left:1px solid var(--line);padding:0 12px 12px;min-width:0}

.frow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.home{padding:28px 0 24px}
