[package]
name = "wisp-ui"
description = "wisp-science desktop UI (Leptos CSR, built by Trunk, loaded in the Tauri WebView2)."
version = "1.9.0"
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "wisp-ui"
path = "src/main.rs"

[dependencies]
wisp-dto = { path = "../crates/wisp-dto" }
leptos = { version = "0.6", features = ["csr", "serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Event", "EventTarget", "InputEvent", "KeyboardEvent", "MouseEvent", "WheelEvent", "DragEvent", "DataTransfer", "FileList", "File", "Blob", "HtmlTextAreaElement", "HtmlInputElement", "HtmlSelectElement", "HtmlElement", "Window", "Document", "Element", "Node", "DomTokenList", "Navigator", "Clipboard", "Selection", "Storage", "DomRect", "CustomEvent", "CustomEventInit"] }
console_error_panic_hook = "0.1"
futures-channel = "0.3"

# Standalone workspace: this crate compiles to wasm32 for the Tauri WebView,
# separate from the native Cargo workspace at the repo root.
[workspace]

# wasm32 defaults to abort; unwind lets install_panic_hook keep the renderer
# alive after an OwnerDisposed race in a keyed row.
[profile.release-wasm]
inherits = "release"
panic = "unwind"
