<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wisp</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff; --fg: #202124; --muted: #5f6368; --line: #dadce0;
        --bubble: #f1f3f4; --accent: #1a73e8; --bad: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --line: #3c4043;
          --bubble: #303134; --accent: #8ab4f8; --bad: #f28b82;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; display: flex; flex-direction: column;
        font: 13px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg);
      }
      header {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 12px; border-bottom: 1px solid var(--line);
      }
      #page { flex: 1; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #log { flex: 1; overflow-y: auto; padding: 12px; }
      .empty { color: var(--muted); }
      .turn { margin-bottom: 14px; }
      .question { background: var(--bubble); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .meta { color: var(--muted); font-size: 12px; margin: 3px 2px 8px; overflow-wrap: anywhere; }
      .answer { overflow-wrap: anywhere; }
      .answer > :first-child { margin-top: 0; }
      .answer > :last-child { margin-bottom: 0; }
      .answer p { margin: 0 0 8px; white-space: pre-wrap; }
      .answer h1, .answer h2, .answer h3, .answer h4, .answer h5, .answer h6 { margin: 12px 0 6px; line-height: 1.3; }
      .answer h1 { font-size: 17px; }
      .answer h2 { font-size: 15px; }
      .answer h3, .answer h4, .answer h5, .answer h6 { font-size: 13px; }
      .answer ul, .answer ol { margin: 0 0 8px; padding-left: 20px; }
      .answer li { margin: 2px 0; }
      .answer li > ul, .answer li > ol { margin-bottom: 0; }
      .answer code { font: 12px ui-monospace, monospace; background: var(--bubble); border-radius: 4px; padding: 1px 4px; }
      .answer pre { margin: 0 0 8px; padding: 8px 10px; overflow-x: auto; background: var(--bubble); border-radius: 8px; }
      .answer pre code { background: none; padding: 0; white-space: pre; }
      .answer blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
      .answer table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 0 0 8px; }
      .answer th, .answer td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; vertical-align: top; }
      .answer th { background: var(--bubble); }
      .answer hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
      .answer a { color: var(--accent); }
      .status { color: var(--muted); font-size: 12px; margin-top: 4px; }
      .error { color: var(--bad); }
      .approval { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
      .approval pre {
        margin: 6px 0; max-height: 160px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
        font: 12px ui-monospace, monospace; color: var(--muted);
      }
      form { border-top: 1px solid var(--line); padding: 10px 12px; }
      textarea {
        width: 100%; resize: vertical; padding: 8px; border: 1px solid var(--line); border-radius: 8px;
        font: inherit; background: var(--bg); color: var(--fg);
      }
      textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
      button {
        font: inherit; padding: 4px 12px; border: 1px solid var(--line); border-radius: 6px;
        background: var(--bg); color: var(--fg); cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
      button:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <header>
      <div id="page"></div>
      <button id="new" type="button"></button>
    </header>
    <main id="log" aria-live="polite"></main>
    <form id="form">
      <textarea id="question" rows="3"></textarea>
      <div class="actions">
        <button id="stop" type="button" hidden></button>
        <button id="send" type="submit" class="primary"></button>
      </div>
    </form>
    <script src="markdown.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
